<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kino Vibe Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        #player-container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        iframe { width: 100%; height: 100%; border: none; }
        .error { color: #ff4444; font-family: sans-serif; text-align: center; padding: 20px; }
        .loading { color: #ffffff; font-family: sans-serif; text-align: center; }
    </style>
</head>
<body>
    <div id="player-container">
        <div class="loading">⏳ Загрузка плеера...</div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Раскрыть на весь экран
        tg.ready();

        const container = document.getElementById('player-container');
        
        // Получаем ссылку из параметров URL (например, ?url=https://...)
        const urlParams = new URLSearchParams(window.location.search);
        const videoUrl = urlParams.get('url');

        if (videoUrl) {
            // Декодируем ссылку и создаем iframe
            const decodedUrl = decodeURIComponent(videoUrl);
            container.innerHTML = `<iframe src="${decodedUrl}" allowfullscreen="true" allow="autoplay; encrypted-media; fullscreen; picture-in-picture"></iframe>`;
        } else {
            container.innerHTML = `<div class="error">❌ Ошибка: ссылка на видео не передана.<br>Попробуйте запустить через бота.</div>`;
        }
    </script>
</body>
</html>
