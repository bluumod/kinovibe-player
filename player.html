<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kino Vibe Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключаем HLS.js для потокового видео (.m3u8) -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #000; color: white; font-family: sans-serif; overflow: hidden; }
        #player-container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        iframe, video { width: 100%; height: 100%; border: none; outline: none; }
        .error { padding: 20px; text-align: center; }
    </style>
</head>
<body>
    <div id="player-container">
        <div class="error">Загрузка плеера...</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        const urlParams = new URLSearchParams(window.location.search);
        const videoUrl = urlParams.get('url');
        const container = document.getElementById('player-container');

        if (videoUrl) {
            // Если это YouTube или ссылка на страницу с iframe
            if (videoUrl.includes('youtube.com') || videoUrl.includes('vimeo.com')) {
                container.innerHTML = `<iframe src="${videoUrl}" allowfullscreen allow="autoplay; encrypted-media"></iframe>`;
            } 
            // Если это потоковое видео .m3u8 (как у HDrezka)
            else if (videoUrl.includes('.m3u8')) {
                container.innerHTML = `<video id="videoPlayer" controls autoplay></video>`;
                const video = document.getElementById('videoPlayer');
                if (Hls.isSupported()) {
                    const hls = new Hls();
                    hls.loadSource(videoUrl);
                    hls.attachMedia(video);
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = videoUrl;
                }
            } 
            // Если это прямая ссылка на .mp4
            else {
                container.innerHTML = `<video src="${videoUrl}" controls autoplay></video>`;
            }
        } else {
            container.innerHTML = `<div class="error">Ошибка: Ссылка на видео не передана.</div>`;
        }
    </script>
</body>
</html>
