<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kino Vibe Player</title>
    <!-- Подключаем скрипт Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #000; color: white; font-family: sans-serif; }
        #player-container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        iframe { width: 100%; height: 100%; border: none; }
        .error { padding: 20px; text-align: center; }
    </style>
</head>
<body>
    <div id="player-container">
        <div class="error">Загрузка плеера...</div>
    </div>

    <script>
        // Инициализируем Telegram WebApp
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        // Получаем параметры из URL (ссылку на видео, которую передаст бот)
        const urlParams = new URLSearchParams(window.location.search);
        const videoUrl = urlParams.get('url');

        const container = document.getElementById('player-container');

        if (videoUrl) {
            // Если бот передал прямую ссылку на плеер (iframe)
            container.innerHTML = `<iframe src="${videoUrl}" allowfullscreen allow="autoplay; encrypted-media"></iframe>`;
        } else {
            container.innerHTML = `<div class="error">Ошибка: Ссылка на видео не передана.</div>`;
        }
    </script>
</body>
</html>
